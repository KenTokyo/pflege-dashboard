project_id = "pflege-dashboard-phase0"

[api]
enabled = true
port = 56421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 56422
shadow_port = 56420
major_version = 17

[db.pooler]
enabled = false
port = 56429

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 56423
api_url = "http://127.0.0.1"

[inbucket]
enabled = false
port = 56424

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 300
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.sessions]
timebox = "8h"
inactivity_timeout = "15m"

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 56427

[experimental]
stack = true
